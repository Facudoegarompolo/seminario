services:
  postgres:
    image: postgres:16
    container_name: digitalqueue-postgres
    environment:
      POSTGRES_DB: digital_queue_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digital_queue_db"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
