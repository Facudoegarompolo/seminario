spring.application.name=digitalqueue

# Puerto del backend
server.port=8080

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/digital_queue_db
spring.datasource.username=celeste
spring.datasource.password=celeste123

server.address=0.0.0.0

# Driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evita consultas abiertas fuera del service
spring.jpa.open-in-view=false

# Base de datos Cassandra - métricas del algoritmo de fila
spring.cassandra.contact-points=localhost:9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=digital_queue_metrics
spring.cassandra.schema-action=none
spring.cassandra.request.timeout=10s
spring.cassandra.connection.connect-timeout=10s
spring.cassandra.connection.init-query-timeout=10s

# Web Push / VAPID
# Generar claves con la CLI de web-push y configurar estos valores para enviar push reales.
app.push.vapid.public-key=
app.push.vapid.private-key=
app.push.vapid.subject=mailto:admin@digitalqueue.local
