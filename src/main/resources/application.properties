spring.application.name=digitalqueue

# Puerto del backend
server.port=8080

# Base de datos PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/digital_queue_db?options=-c%20TimeZone%3DUTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Driver PostgreSQL
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evita consultas abiertas fuera del service
spring.jpa.open-in-view=false

# Web Push / VAPID
# Generar claves con la CLI de web-push y configurar estos valores para enviar push reales.
app.push.vapid.public-key=
app.push.vapid.private-key=
app.push.vapid.subject=mailto:admin@digitalqueue.local
# JWT admin
app.jwt.secret=digitalqueue-dev-secret-key-min-32-chars!!
app.jwt.expiration-hours=24
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
